# Local observability stack: traces (Tempo), metrics (Prometheus), dashboards (Grafana).
# Traces, metrics and dashboards are kept in named volumes (removed only by `down -v`).
# Start the app with OTLP_TRACES_ENDPOINT=http://localhost:4318/v1/traces TRACE_SAMPLING=1.0
services:
  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./observability/tempo.yaml:/etc/tempo.yaml:ro", "tempodata:/var/tempo"]
    ports: ["4318:4318", "3200:3200"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "promdata:/prometheus"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes: ["./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/ds.yml:ro", "grafanadata:/var/lib/grafana"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["3000:3000"]
    depends_on: [tempo, prometheus]

volumes:
  tempodata:
  promdata:
  grafanadata:
