# Load balancer in front of the app instances (used by docker-compose.cluster.yml).
upstream recharge {
    server app1:8080 max_fails=2 fail_timeout=10s;
    server app2:8080 max_fails=2 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    client_max_body_size 256k;                 # keep >= the app's REQUEST_MAX_TELEMETRY_BODY (default 256KB)

    # Only the public API and its docs. Health and metrics live on each instance's port 8081 and are not proxied.
    location ~ ^/(v1|v3/api-docs|swagger-ui)(/|$) {
        proxy_pass http://recharge;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        # Overwrite, never append: the app trusts this header for per-IP rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        add_header X-Upstream $upstream_addr always;   # which instance answered (demo aid; drop in production)
    }

    location = /swagger-ui.html { proxy_pass http://recharge; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-For $remote_addr; }

    location / { return 404; }
}
