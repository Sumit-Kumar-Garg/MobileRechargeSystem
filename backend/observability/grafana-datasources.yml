apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
  - name: Recharge DB (funnel and client latency)
    type: grafana-postgresql-datasource
    url: host.docker.internal:5432
    user: recharge
    jsonData:
      database: recharge
      sslmode: disable
    secureJsonData:
      password: recharge
