# Local infrastructure: Postgres, Kafka, Redis.
# Settings come from .env (copy .env.example); every value has a local default, so it also runs without one.
# Data lives in NAMED volumes and survives `docker compose down` and container re-creation.
# Only `docker compose down -v` (or `docker volume rm`) deletes it.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-recharge}
      POSTGRES_USER: ${DB_USER:-recharge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-recharge}
    ports: ["${DB_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kafka:                       # single-node KRaft broker for local development
    image: apache/kafka:3.8.0
    ports: ["${KAFKA_PORT:-9092}:9092"]
    volumes:
      - kafkadata:/var/lib/kafka/data
    environment:
      # Fixed id: the data volume is formatted for this cluster; a different id would not start on it.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LOG_DIRS: /var/lib/kafka/data   # default would be /tmp inside the container: lost on re-creation
      # PLAINTEXT (localhost:9092) is for an app running on the host; INTERNAL (kafka:29092) is for app
      # containers on the compose network (see docker-compose.cluster.yml)
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-168}
    restart: unless-stopped

  redis:                       # shared rate-limit counters (RATE_LIMIT_STORE=redis)
    image: redis:7-alpine
    # Append-only file: counters such as the failed-payment lockout survive a restart instead of resetting.
    # Without REDIS_PASSWORD no password is required (local only).
    command: ["sh", "-c", "exec redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
  redisdata:
